name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # A skip reads as a pass. In CI a missing toolchain must fail instead.
      MUTATOR_REQUIRE_TOOLCHAINS: "1"
    steps:
      # crapper_link imports crapper from the ../crapper sibling checkout.
      - uses: actions/checkout@v4
        with:
          path: mutator
      - uses: actions/checkout@v4
        with:
          repository: qinyuanj/crapper
          path: crapper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lua 5.4 and the LuaRocks tree the Lua tests need, from this repository's
      # own installer rather than third-party actions: it is the same recipe
      # crapper and dsh-uml-viewer install, it proves the toolchain before the
      # suite runs, and it is the documented local Windows path in AGENTS.md. With
      # MUTATOR_REQUIRE_TOOLCHAINS=1 a failed install fails the job instead of
      # turning those tests into skips.
      - name: Lua 5.4 fixture toolchain
        run: ./scripts/setup-windows.ps1
      - run: python -m pip install -e ".[dev]"
        working-directory: mutator
      - run: python -m pytest -q -rs
        working-directory: mutator
