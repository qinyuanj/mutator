name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # A skip reads as a pass. In CI a missing toolchain must fail instead.
      MUTATOR_REQUIRE_TOOLCHAINS: "1"
    steps:
      # crapper_link imports crapper from the ../crapper sibling checkout.
      - uses: actions/checkout@v4
        with:
          path: mutator
      - uses: actions/checkout@v4
        with:
          repository: qinyuanj/crapper
          path: crapper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lua 5.4 and the LuaRocks tree the Lua tests need. With
      # MUTATOR_REQUIRE_TOOLCHAINS=1 a failed install fails the job instead of
      # turning those tests into skips.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install busted
      - run: luarocks install luacov
      - run: luarocks install cluacov 1.0.0-1
      - run: luarocks install luacov-reporter-lcov
      - run: python -m pip install -e ".[dev]"
        working-directory: mutator
      - run: python -m pytest -q -rs
        working-directory: mutator
