name: test

on:
  push:
    branches: [main, lua]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: mutator
      - uses: actions/checkout@v6
        with:
          repository: qinyuanj/crapper
          ref: main
          path: crapper
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ubuntu Lua build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev
      - name: Build native Lua 5.4 and LuaRocks
        shell: pwsh
        run: |
          python -m pip install hererocks==0.25.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) { $env:PATH = ".;$env:PATH" }
          hererocks "$HOME/.luarocks" --lua 5.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$HOME/.luarocks/bin" + [IO.Path]::PathSeparator + $env:PATH
          hererocks "$HOME/.luarocks" --luarocks 3.8.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$HOME/.luarocks/bin" >> $env:GITHUB_PATH
          "LUA_PATH=$HOME/.luarocks/share/lua/5.4/?.lua;$HOME/.luarocks/share/lua/5.4/?/init.lua;;" >> $env:GITHUB_ENV
          $library = if ($IsWindows) { '?.dll' } else { '?.so' }
          "LUA_CPATH=$HOME/.luarocks/lib/lua/5.4/$library;;" >> $env:GITHUB_ENV
      - name: Install Busted and Lua coverage tools
        shell: pwsh
        run: |
          foreach ($rock in @('busted', 'luacov', 'luacov-reporter-lcov')) {
            luarocks --tree="$HOME/.luarocks" install $rock
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $env:LUA_PATH = "$HOME/.luarocks/share/lua/5.4/?.lua;$HOME/.luarocks/share/lua/5.4/?/init.lua;;"
          $library = if ($IsWindows) { '?.dll' } else { '?.so' }
          $env:LUA_CPATH = "$HOME/.luarocks/lib/lua/5.4/$library;;"
          lua -e "require('busted.runner'); require('luacov'); require('luacov.reporter.lcov')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e "./mutator[dev]"
      - name: Required real Busted task acceptance
        run: python -m pytest tests/test_busted_task.py -q
        working-directory: mutator
      - run: python -m pytest
        working-directory: mutator
