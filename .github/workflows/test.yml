name: test

on:
  push:
    branches: [main, lua]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: mutator
      - uses: actions/checkout@v6
        with:
          repository: qinyuanj/crapper
          ref: main
          path: crapper
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Ubuntu Lua build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev
      - name: Build native Lua 5.4 and LuaRocks
        run: |
          python -m pip install hererocks==0.25.1
          hererocks "$HOME/.luarocks" --lua 5.4
          export PATH="$HOME/.luarocks/bin:$PATH"
          hererocks "$HOME/.luarocks" --luarocks 3.8.0
          echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=$HOME/.luarocks/share/lua/5.4/?.lua;$HOME/.luarocks/share/lua/5.4/?/init.lua;;" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$HOME/.luarocks/lib/lua/5.4/?.so;;" >> "$GITHUB_ENV"
      - name: Install Busted and Lua coverage tools
        run: |
          for rock in busted luacov luacov-reporter-lcov "cluacov 1.0.0-1"; do
            luarocks --tree="$HOME/.luarocks" install "$rock"
          done
          export LUA_PATH="$HOME/.luarocks/share/lua/5.4/?.lua;$HOME/.luarocks/share/lua/5.4/?/init.lua;;"
          export LUA_CPATH="$HOME/.luarocks/lib/lua/5.4/?.so;;"
          lua -e "require('busted.runner'); require('luacov'); require('luacov.reporter.lcov')"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e "./mutator[dev]"
      - name: Required real Busted task acceptance
        run: python -m pytest tests/test_busted_task.py -q
        working-directory: mutator
      - run: python -m pytest
        working-directory: mutator
